x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-healthcheck: &healthcheck
  interval: 20s
  timeout: 5s
  retries: 3
  start_period: 30s

x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true

# =============================================================================
# 资源预算（2 vCPU / 4GB RAM 主机）—— Celery 已下线，资源聚焦核心业务
# 设计目标：任意负载下 CPU 硬上限之和 = 1.40 vCPU = 70% of 2.0，保证峰值 ≤70%。
#   分配：nginx 0.10 + web(Django) 0.90 + db(MySQL) 0.40 = 1.40
# 内存硬上限之和 ≈ 1.73GB（< 70% of 4GB = 2.8GB）。web 独占 D Django/R2 图片处理，
#   gunicorn 2 个 worker（每 worker 尽池吞吐）；无 Celery，省出的内存/CPU 尽归 web 与 db。
# 注意：cpus 为 Docker 硬上限（--cpus），即使满载也不会突破该比例；真实利用率取决于流量。
# =============================================================================
services:
  nginx:
    build:
      context: ./web/react
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-v1.0.6}
        GIT_COMMIT: ${GIT_COMMIT:-latest}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAAEod4A8ngpZCK06H}
    image: carvenex-nginx:${APP_VERSION:-v1.0.6}
    restart: unless-stopped
    logging: *default-logging
    # 仅绑定环回：源站不对公网暴露 80/443，所有公网流量经 Cloudflare Tunnel
    # （cloudflared 通过 127.0.0.1:443 回源 nginx）。这样彻底避免境内接入层
    # 对 80/443 入站的拦截(webblock)/RST，也杜绝公网扫描。
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    secrets:
      - tls_cert
      - tls_key
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/log/nginx:size=8m,uid=101,gid=101
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, internal]
    mem_limit: 64m
    mem_reservation: 32m
    memswap_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        APP_VERSION: ${APP_VERSION:-v1.0.6}
        GIT_COMMIT: ${GIT_COMMIT:-latest}
    image: carvenex-django:${APP_VERSION:-v1.0.6}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_TYPE: django
      DJANGO_ENV: prod
      DAPHNE_PORT: "8001"
      AWS_REGION: ${AWS_REGION:-auto}
      STATIC_ROOT: /app/static
      # 媒体卷挂载点：与下面的 media_data:/app/media 保持一致。
      # settings 中 MEDIA_ROOT 优先读取该值，不再由 BASE_DIR 推导。
      MEDIA_ROOT: /app/media
      # 缓存/会话走 MySQL，Celery broker&result 走 MySQL（见 settings/base.py）
      # 2C4G：固定 2 个 gevent 协程 worker，极简架构
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "1"
      GUNICORN_WORKER_CLASS: gevent
      GUNICORN_MAX_REQUESTS: "1000"
      GUNICORN_MAX_REQUESTS_JITTER: "100"
      GUNICORN_TIMEOUT: "300"
      GUNICORN_GRACEFUL_TIMEOUT: "30"
      # gevent 协程需纯 Python DB 驱动（mysqlclient 为 C 扩展，gevent 无法协作式调度其 socket）
      DJANGO_DB_DRIVER: "pymysql"
      # 2C4G 图片内存护栏（详见 utils/upload_security.py）：
      # 单张图解码像素上限，超限则等比缩小（软降级，不拒绝），16MP 可完整容纳 4000×4000 商品方图
      MEDIA_IMPORT_MAX_IMAGE_PIXELS: "16000000"
      # 面向用户的上传接口硬上限，超限直接 400（前端裁剪器最长边 2560 → 约 8.2MP，12MP 够用）
      MEDIA_MAX_IMAGE_PIXELS: "12000000"
      # import_media_dir 的并发封顶。os.cpu_count() 读到的是宿主核数（不受 cgroup 限制），
      # 不封顶的话 8 核宿主会起 7 个线程同时解码原图，足以打爆 544m 的容器
      MEDIA_IMPORT_MAX_CONCURRENCY: "2"
      # 商品数据源目录：统一固定为仓库内的 backend/seed_products（宿主机），
      # 只读挂载到容器内 /app/seed_products。此处刻意不使用变量插值——
      # 一旦允许覆盖 SEED_PRODUCTS_DIR，就可能与下面的挂载目标不一致，
      # 导致「声明的路径」与「实际挂载的位置」对不上（历史踩过的坑）。
      # 该目录不随镜像分发（.dockerignore 已排除），避免镜像 +144MB。
      SEED_PRODUCTS_DIR: /app/seed_products
    env_file: [.env.production]
    volumes:
      # 媒体卷挂在容器 /app/media（应用根这一层，不再深入 project/），
      # 并通过 MEDIA_ROOT 环境变量与之对齐（settings 现已支持覆盖），
      # 确保上传文件落到卷上而非容器可写层（web 为 read_only）。
      - media_data:/app/media
      - static_data:/app/static
      - django_logs:/app/logs
      # 商品数据源（只读挂载）：固定把仓库内 backend/seed_products 挂到容器
      # /app/seed_products，与上面的 SEED_PRODUCTS_DIR 始终一致。
      # 内容为 products.xlsx + images/<商品目录>/ ；缺失会导致部署后无商品。
      - ./backend/seed_products:/app/seed_products:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, egress]
    mem_limit: 1024m
    mem_reservation: 512m
    memswap_limit: 1280m
    cpus: "0.90"
    pids_limit: 96
    <<: *app-security
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ >/dev/null && curl -fsS http://127.0.0.1:8001/health/ >/dev/null"]
      <<: *healthcheck
      start_period: 45s

  db:
    build:
      context: ./backend/mysql
      dockerfile: Dockerfile
    image: carvenex-mysql:${APP_VERSION:-v1.0.6}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-carvenex}
      MYSQL_USER: ${DB_USER:-carvenex}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose: ["3306"]
    networks: [internal]
    mem_limit: 640m
    mem_reservation: 384m
    memswap_limit: 640m
    cpus: "0.40"
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    command:
      - --innodb-buffer-pool-size=384M
      # 连接数上限：2 个 gunicorn worker(各池≤15) + daphne 预留；已无 Celery 占用
      - --max-connections=60
      - --performance-schema=OFF
      - --local-infile=OFF
      # 慢查询阈值 500ms（2C4G：实时联表聚合/未命中索引的查询会被记录，便于定位）
      - --slow-query-log=ON
      - --long-query-time=0.5
      - --log-queries-not-using-indexes=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
  media_data:
  static_data:
  django_logs:

secrets:
  tls_cert:
    file: ${TLS_CERT_PATH:-./deploy/nginx-certs/tunnel.crt}
  tls_key:
    file: ${TLS_KEY_PATH:-./deploy/nginx-certs/tunnel.key}

networks:
  edge:
  egress: {}
  internal:
    internal: true

