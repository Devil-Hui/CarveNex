services:
  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: carvenex-mysql:dev
    restart: unless-stopped
    env_file: [../.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-backend}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin123456}
    expose: ["3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.4
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    hostname: web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_TYPE: django
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      # 本机即生产源站：允许 Cloudflare Tunnel 公网域名访问（api.carvenex.com）
      DJANGO_DEV_ALLOWED_HOSTS: ${DJANGO_DEV_ALLOWED_HOSTS:-api.carvenex.com}
      # 邮件账号池（QQ，.env 配置，用于验证码发送）
      EMAIL_ACCOUNTS: ${EMAIL_ACCOUNTS:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-backend}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123456}
      # 无 Redis：缓存/会话走 MySQL，Celery broker&result 走 MySQL（见 settings/base.py）
      STATIC_ROOT: /backend/static
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-in-prod}
      # 不注入 DJANGO_SUPERUSER_*：确保容器创建不自动生成超级管理员。
      # 需要超管时手动执行：docker compose exec web python manage.py createsuperuser
    env_file: [../.env]
    ports: ["8000:8000", "8001:8001"]
    volumes:
      - .:/backend
      - media_data:/backend/media
      - static_data:/backend/static
      # 批量导入素材目录：把本机 CarveNex/_media_import/ 挂进容器固定路径 /media_import。
      # 之后只需把「商品名」文件夹丢进宿主该目录，无需再操作 Docker。
      # 说明：bind 挂载需在容器重启（docker compose up -d）后生效，属一次性设置。
      - ../_media_import:/media_import
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery_worker"]
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.5
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      # 邮件账号池（QQ，.env 配置，验证码异步发送需要）
      EMAIL_ACCOUNTS: ${EMAIL_ACCOUNTS:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-backend}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123456}
      # 无 Redis：Celery broker&result 走 MySQL（见 settings/base.py _celery_mysql_url）
      CELERY_CONCURRENCY: "1"
      CELERY_BEAT_ENABLED: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-in-prod}
    env_file: [../.env]
    volumes:
      - .:/backend
      - media_data:/backend/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  media_data:
  static_data:
