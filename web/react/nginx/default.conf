# =============================================================================
# Nginx Configuration — CarveNex Frontend + API Gateway
# Handles: Static files (React SPA) + Reverse proxy to Django backend
# =============================================================================

# ── CORS 兜底：在 nginx 层直接放行受信任来源 ─────────────────────────────
# 目的：即使 Django 异常 / 限流 / 错误页 / preflight 未触及后端，浏览器也
# 一定能拿到 Access-Control-Allow-* 头，杜绝 "No 'Access-Control-Allow-Origin'"。
# 来源白名单为空时 ACAO 不输出（同源请求无需 CORS）。www/admin/shop 均托管于
# Cloudflare Pages，此处列出对应的生产域名；e.g. api.carvenex.com 自身也算。
map $http_origin $cors_origin {
    default "";
    "~^https://(www\.)?carvenex\.com$" $http_origin;
    "~^https://admin\.carvenex\.com$" $http_origin;
    "~^https://shop\.carvenex\.com$" $http_origin;
    "~^http://localhost(:\d+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:\d+)?$" $http_origin;
}

# =============================================================================

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:4m;
    ssl_session_timeout 10m;

    # ── Hide Nginx version from error pages ───────────────────────────────────
    server_tokens off;

    # ── Security headers ──────────────────────────────────────────────────────
    # Alt-Svc: clear —— 显式告知浏览器不要使用 HTTP/3(QUIC) 连接本源站。
    # 源站 nginx 未启用 QUIC；之前经 Cloudflare 代理时浏览器缓存了 h3 的
    # alt-svc 提示，切直连后 QUIC 握手失败 → ERR_QUIC_PROTOCOL_ERROR。
    add_header Alt-Svc "clear" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://*.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── CORS（nginx 层兜底，不依赖后端）───────────────────────────────────────
    # 白名单来源才回显 ACAO；非白名单来源不输出（等同跨域失败，符合预期）。
    # 后端 Django 的 CORS 头仍会带到（DRF 处理），此处多一重保障，保证
    # preflight/错误页/限流响应也必然携带 CORS 头。
    add_header Access-Control-Allow-Origin "$cors_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-CSRFToken, X-Request-ID, X-Requested-With, Idempotency-Key" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header Vary "Origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_proxied any;

    # ── Limits ────────────────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn per_ip 100;
    limit_conn_status 429;
    limit_req_status 429;

    # ── API 文档端点：生产环境一律 404（后端已 DEBUG 门控，此处边缘双保险）─────
    location ~ ^/api/(schema|swagger-ui|redoc)(/|$) {
        return 404;
    }

    location ~ ^/api/(v1/)?users/(session/(login|refresh)|token(/refresh)?|register|login(/code/send)?|refresh|email/(send|verify/send)|social/login)/?$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?promotion/[^/]+/claim/?$ {
        limit_req zone=coupon burst=5 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?order/checkout/?$ {
        limit_req zone=checkout burst=8 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?payment/(create|refund|webhook/[^/]+)/?$ {
        limit_req zone=payment burst=8 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?(goods/upload/image|goods/spu/import|goods/media/spu/[0-9]+/upload|goods/media/spu/[0-9]+/video/upload|support/upload|users/upload-avatar)/?$ {
        limit_req zone=upload burst=6 nodelay;
        # 图片四尺寸 + 商品视频（≤200MB）统一放行；旧 10m 限制导致视频 413/连接中断
        client_max_body_size 220m;
        client_body_timeout 300s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        # 大文件上传 + 对象存储写入耗时较长，避免 nginx 提前断开（ERR_CONNECTION_CLOSED / 502）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 20s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Nginx local health check ──────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Prometheus metrics (from Django) ──────────────────────────────────────
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web/metrics;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ── Django static files (CSS/JS for admin, DRF, Swagger UI, etc.) ────────
    # Served directly from shared volume for performance + CSP compliance
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── 营销/场景视频（构建产物随 SPA 打包进镜像 /usr/share/nginx/html/videos）──
    # 视频文件（public/videos/laserpeck，约 167MB）随前端 build 进入 dist →
    # Dockerfile COPY 到镜像 html。之前缺此 location 导致 /videos/ 落到默认 root
    # 404（或 SPA fallback HTML），落地页 Hero/场景画廊视频无法播放。
    location /videos/ {
        alias /usr/share/nginx/html/videos/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Media files (user uploads) ────────────────────────────────────────────
    location /media/ {
        alias /var/www/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── API proxy to Django backend ───────────────────────────────────────────
    location /api/ {
        # 浏览器 preflight：直接返回 204 + CORS 头，不落后端，保证任何情况都通过
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$cors_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-CSRFToken, X-Request-ID, X-Requested-With, Idempotency-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Vary "Origin" always;
            add_header Content-Length "0" always;
            return 204;
        }

        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;

        # 抹掉后端 Django corsheaders 返回的 CORS 头，避免与 server 级 add_header
        # 叠加成 "Access-Control-Allow-Origin contains multiple values"（浏览器 CORS 报错）。
        # CORS 统一由本站 nginx（map 白名单 + server 级 add_header）唯一提供。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保持上游 keep-alive（Connection: close 会强制每次请求后断连，是 ERR_CONNECTION_CLOSED 的常见诱因）
        proxy_set_header Connection "";

        # Timeouts
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;

        # Buffering (off for streaming responses)
        proxy_buffering off;

        # Retry on backend failure
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /ws/ {
        set $upstream_ws web:8001;
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # ── Django admin (optional, uncomment if you need Django Admin UI) ─────────
    # location /django-admin/ {
    #     proxy_pass http://django_backend/admin/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── Django health check (pass-through) ────────────────────────────────────
    location /health/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web/health/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Cloudflare Pages 托管前端，nginx 仅做 API 代理 ──────────────────────────
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"carvenex-api"}';
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
